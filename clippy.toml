# ═══════════════════════════════════════════════════════════════════════════
#  clippy 의 "설정이 필요한 lint" 만 여기에 적는다.
#
#  lint 를 켜고 끄는 것(deny/warn/allow)은 Cargo.toml 의 [workspace.lints] 에
#  있다. 이 파일은 **lint 에 넘길 값**을 담는다. 예: "어떤 함수를 금지할지".
#
#  적용 범위는 워크스페이스 전체다. 크레이트별로 다르게 하려면 각 크레이트
#  디렉터리에 clippy.toml 을 따로 둔다.
# ═══════════════════════════════════════════════════════════════════════════

# ── 코어는 OS 시계를 직접 호출하지 않는다 (PRD D11 / TECH_STACK T6) ─────────
#
# 왜: 시각의 출처가 코드 안에 박혀 있으면 (1) 리플레이로 같은 결과를 재현할 수
# 없고 (2) 테스트가 실제 시간에 묶여 CI 에서 흔들린다. 그래서 Clock 트레이트를
# 주입받고, 구현체만 진짜 시계를 안다.
#
# 이 규칙을 문서로만 적으면 언젠가 누가 Instant::now() 를 쓴다. 린트로 막으면
# 그 순간 빌드가 실패한다 - 규칙을 기계가 지킨다.
#
# 유일한 예외는 rsm-core::time::MonotonicClock 내부이며, 그곳에서만
# #[allow(clippy::disallowed_methods, reason = "...")] 로 명시적으로 허용한다.
# 즉 코어 전체에서 OS 시계를 읽는 곳은 문법적으로 딱 한 군데다.
disallowed-methods = [
  { path = "std::time::Instant::now", reason = "inject the Clock trait instead" },
  { path = "std::time::SystemTime::now", reason = "wall-clock time must not drive judgements (it can jump backwards)" },
]

# ── 계측 매크로는 배출 지점 한 곳에서만 (TECH_STACK T7) ──────────────────────
#
# 왜: `metrics` 매크로는 설치된 레코더에 따라 해시 조회·락·할당을 한다. 1 kHz tick
# 경로에 들어가면 R-08(할당 0)과 지터가 레코더 구현에 달리게 된다. tick 경로는
# HealthRegistry 의 원자 슬롯에만 쓰고, Supervisor 스레드가 그 값을 옮긴다.
#
# 유일한 예외는 rsm-core/src/telemetry.rs 이며, 파일 머리의
# #![allow(clippy::disallowed_macros, reason = "...")] 로 명시적으로 허용한다.
disallowed-macros = [
  { path = "metrics::counter", reason = "only rsm-core/src/telemetry.rs may touch the metrics facade" },
  { path = "metrics::gauge", reason = "only rsm-core/src/telemetry.rs may touch the metrics facade" },
  { path = "metrics::histogram", reason = "only rsm-core/src/telemetry.rs may touch the metrics facade" },
  { path = "metrics::describe_counter", reason = "only rsm-core/src/telemetry.rs may touch the metrics facade" },
  { path = "metrics::describe_gauge", reason = "only rsm-core/src/telemetry.rs may touch the metrics facade" },
  { path = "metrics::describe_histogram", reason = "only rsm-core/src/telemetry.rs may touch the metrics facade" },
]
