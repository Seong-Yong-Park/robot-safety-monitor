# replay-a — 적어 둔 신호를 다시 흘려 구성을 시험한다 (R-10, PRD D28).
#
#   rsm replay --config examples/replay-a.yaml --duration-ms 1500
#
# 벽시계 대신 가상 시각으로 돈다. 1.5 초 분량이 기다림 없이 끝나고, 몇 번을 돌려도
# 출력이 바이트 단위로 같다. rsm-modules/tests/replay.rs 가 이 출력을 스냅샷으로 고정한다
# — 모듈을 고쳐 출력이 달라지면 시험이 실패하고 차이를 보여 준다.
#
# 같은 파일을 `rsm run`으로 돌리면 실제 시각으로 재생된다(첫 tick 이 시각 0).
version: 1

groups:
  control:
    period_hz: 100          # 10 ms

modules:
  - name: recording         # 입력: 이 설정 옆의 replay-a.jsonl
    type: replay
    group: control
    params: { path: replay-a.jsonl }

  - name: torque_limit
    type: threshold
    group: control
    params:
      signal: joint.torque
      limit: 100.0
      hazard: internal.joint.torque_limit
      severity: critical
      ttl_ms: 50

  - name: proximity
    type: min_distance
    group: control
    params:
      signal: obstacle.distance
      warn_m: 1.0
      critical_m: 0.4
      hazard: external.min_distance
      ttl_ms: 50

  - name: wheel_link
    type: comm_timeout
    group: control
    params:
      signal: wheel.speed
      timeout_ms: 100
      hazard: internal.comm_timeout
      ttl_ms: 50

arbiter: { period_hz: 20 }
supervisor: { period_hz: 10, group_stale_after_ms: 500 }
sink: { format: jsonl, path: "-", on_change_only: true }

recommended_action:
  by_level: { advisory: none, warning: slow_down, critical: stop }
  on_unavailable: stop
