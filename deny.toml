# ═══════════════════════════════════════════════════════════════════════════
#  cargo-deny 정책 (TECH_STACK T10)
#
#  cargo-deny 는 cargo 에 기본 포함되지 않은 별도 도구다.
#    cargo install cargo-deny   (한 번만)
#    cargo deny check           (검사)
#
#  하는 일: 의존성 트리 전체를 훑어 네 가지를 본다.
#    advisories - 알려진 보안 취약점·yank 된 버전
#    licenses   - 법적으로 받을 수 없는 라이선스가 섞였는지
#    bans       - 쓰면 안 되는 크레이트, 같은 크레이트의 중복 버전
#    sources    - crates.io 아닌 출처에서 온 코드가 있는지
#
#  왜 필요한가: `cargo add` 한 줄이 실제로는 수십 개 크레이트를 끌고 온다.
#  그중 하나가 AGPL 이거나 취약점이 있어도 사람 눈으로는 안 보인다.
#  CI 의 heavy 워크플로에서 이 검사를 돌린다.
#
#  스키마는 cargo-deny 버전에 따라 조금씩 바뀐다. `cargo deny check` 가 스키마
#  오류를 내면 설치된 버전의 문서에 맞춰 키 이름만 조정할 것.
# ═══════════════════════════════════════════════════════════════════════════

# ── 어느 플랫폼 기준으로 의존성 트리를 볼지 ────────────────────────────────
# 의존성은 타깃에 따라 달라진다(windows-sys 는 Windows 에서만 들어오는 식).
# 여기 적힌 세 타깃에서 실제로 쓰이는 것만 검사한다 - 무관한 플랫폼 전용
# 크레이트 때문에 false positive 가 나는 걸 막는다. PRD D16 의 타깃 환경과 일치.
[graph]
targets = [
  { triple = "x86_64-unknown-linux-gnu" },   # 개발·CI
  { triple = "aarch64-unknown-linux-gnu" },  # Jetson 등 ARM 보드 - 실제 배포 타깃
  { triple = "x86_64-pc-windows-msvc" },     # Windows 개발 환경
]

# ── 보안 권고 ───────────────────────────────────────────────────────────────
[advisories]
version = 2        # 설정 스키마 버전. cargo-deny 쪽 형식 번호이지 우리 버전이 아니다
yanked = "deny"    # crates.io 에서 철회(yank)된 버전이 lock 에 있으면 실패
ignore = []        # 예외를 둘 때 여기에 RUSTSEC-ID 를 적고 **이유를 주석으로 남긴다**

# ── 라이선스 ────────────────────────────────────────────────────────────────
[licenses]
version = 2
# 사업화 의도(PRD D8/D17)가 있으므로 허용적(permissive) 라이선스만 받는다.
# 이 목록은 화이트리스트다 - 여기 없는 라이선스는 전부 거부된다. 따라서
# GPL/AGPL/LGPL 계열은 따로 적지 않아도 자동으로 막힌다.
#
# "허용적"이란: 소스를 공개하지 않고 링크해 배포해도 되는 것.
# GPL 계열(copyleft)은 우리 코드까지 같은 라이선스로 공개하라고 요구한다.
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",   # Rust 표준 라이브러리 계열이 쓰는 형태
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",                      # unicode-ident 등이 쓴다
]
# 라이선스 파일을 텍스트로 대조해 판정할 때의 신뢰도 하한.
# 0.9 = "90% 이상 일치해야 그 라이선스로 인정". 낮추면 오탐이 늘어난다.
confidence-threshold = 0.9

# ── 금지·중복 ───────────────────────────────────────────────────────────────
[bans]
# 같은 크레이트의 서로 다른 메이저 버전이 동시에 들어오는 경우(예: rand 0.8 과
# 0.9). 바이너리가 커지고 타입이 호환되지 않아 이상한 에러를 낸다.
# 지금은 경고만 - 의존성이 늘면 "deny" 로 올리는 걸 검토할 것.
multiple-versions = "warn"

# 의존성 버전을 "*" 로 적는 것 금지. 재현 가능한 빌드가 깨진다.
wildcards = "deny"

deny = [
  # TECH_STACK T3: 이름이 비슷하지만 커뮤니티가 회피를 권고하는 크레이트.
  # 유지보수 포크인 serde_yaml_ng 를 쓸 것. 이름이 한 글자 차이라
  # 실수로 들어올 수 있어 명시적으로 막아 둔다.
  { crate = "serde_yml", reason = "신뢰 문제. serde_yaml_ng 사용" },
]

# ── 코드 출처 ───────────────────────────────────────────────────────────────
# 공식 레지스트리 아닌 곳이나 git 저장소에서 직접 끌어오는 의존성을 막는다.
# git 의존성은 태그가 움직일 수 있어 "어제와 같은 코드"를 보장하지 못한다.
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
