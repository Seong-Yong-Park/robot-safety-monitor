# ═══════════════════════════════════════════════════════════════════════════
#  rustfmt(코드 포매터) 설정.
#
#  `cargo fmt` 이 이 파일을 읽는다. C 의 .clang-format 과 같은 자리다.
#
#  의도적으로 거의 비워 두었다. Rust 판에서는 **기본 스타일을 그대로 쓰는 것이
#  표준**이고, 그래야 남의 코드를 읽을 때 눈이 흔들리지 않는다. 들여쓰기 4칸,
#  한 줄 100자, 중괄호 위치 같은 것은 전부 기본값이며 논쟁거리가 아니다.
#
#  edition 만 명시하는 이유: 포매터가 문법을 파싱해야 하는데, 판마다 문법이
#  조금씩 다르다. 이 줄이 없으면 rustfmt 가 2015 판으로 읽어 일부 코드에서
#  잘못 포맷하거나 실패한다. Cargo.toml 의 edition 과 항상 같게 유지할 것.
# ═══════════════════════════════════════════════════════════════════════════
edition = "2024"
